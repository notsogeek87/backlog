name: Server tests

# Le serveur de partage (server/) est déployé automatiquement par Vercel à chaque push :
# ses tests doivent donc passer en CI avant tout merge.
on:
  push:
    branches: ["**"]
    paths: ["server/**", ".github/workflows/server-tests.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund
      - run: npm test
