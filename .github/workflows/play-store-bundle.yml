name: Play Store AAB

# Build ET publication automatique sur Google Play. Repris de trusti
# (.github/workflows/play-store-bundle.yml), lui-même repris de swipernews :
# voir ces fichiers-là pour l'historique complet des pièges déjà rencontrés
# (nom de track "alpha" faux, countryTargeting invalide, mimetype .aab non
# détecté...).
#
# Séparé de android-build.yml : celui-là produit des .apk signés de la clé
# DEBUG committée (app/debug.keystore), utile pour tester mais jamais
# acceptée par Play Store. Ici on signe d'une clé d'UPLOAD dédiée
# (PLAY_STORE_*), que Google re-signe ensuite de sa propre clé (Play App
# Signing) : les deux clés ne se mélangent jamais.
#
# Déclenchement manuel (workflow_dispatch) : publier à chaque push serait
# trop agressif pour des testeurs externes.
#
# versionCode/versionName pour CE canal sont calculés ICI et injectés par -P,
# jamais écrits dans app/build.gradle.kts — même principe que
# android-build.yml (backlogVersionCode/backlogVersionName), pour ne jamais
# entrer en collision avec une publication précédente (Play Store refuse un
# versionCode déjà utilisé, même sur un autre canal).
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Canal Play Store cible"
        required: true
        default: "internal"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Provide placeholder API secrets (CI has none — Twitch calls are not exercised at build time)
        run: |
          mkdir -p app/src/main/java/com/davidgcd/backlog/config
          if [ ! -f app/src/main/java/com/davidgcd/backlog/config/Secrets.kt ]; then
            sed 's/YOUR_TWITCH_CLIENT_ID/ci-placeholder/; s/YOUR_TWITCH_CLIENT_SECRET/ci-placeholder/' \
              app/src/main/java/com/davidgcd/backlog/config/Secrets.kt.example \
              > app/src/main/java/com/davidgcd/backlog/config/Secrets.kt
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Base de départ 0.1.0 (le littéral de app/build.gradle.kts reste à
      # "0.1.0"/versionCode 1, réservé aux builds locaux/debug), + numéro de
      # run pour un versionCode qui grandit à chaque publication.
      - name: Calcule la version de publication
        id: version
        run: |
          set -euo pipefail
          code=$((1000 + ${{ github.run_number }}))
          name="0.1.${{ github.run_number }}"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "versionCode=$code, versionName=$name" >> "$GITHUB_STEP_SUMMARY"

      - name: Déchiffre la clé d'upload Play Store
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_STORE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret PLAY_STORE_KEYSTORE_B64 manquant."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/play-upload.keystore"

      - name: Build AAB
        id: build
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/play-upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PLAY_STORE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.PLAY_STORE_KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.PLAY_STORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle bundleRelease --no-daemon \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }}
          aab="backlog-${{ steps.version.outputs.name }}.aab"
          mv app/build/outputs/bundle/release/app-release.aab "$aab"
          echo "aab=$aab" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.aab }}
          path: ${{ steps.build.outputs.aab }}
          if-no-files-found: error
          retention-days: 30

      - name: Installe le client Google Play
        run: pip install --quiet google-api-python-client google-auth

      - name: Publie sur Google Play
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$PLAY_STORE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Secret PLAY_STORE_SERVICE_ACCOUNT_JSON manquant."
            exit 1
          fi
          python3 tools/publish_play_store.py \
            --package com.davidgcd.backlog \
            --aab "${{ steps.build.outputs.aab }}" \
            --track "${{ inputs.track }}"
