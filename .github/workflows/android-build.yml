name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest GitHub-hosted runners ship with the Android SDK
      # (cmdline-tools, platform-tools, the needed platform/build-tools)
      # already installed under ANDROID_HOME with licenses pre-accepted —
      # android-actions/setup-android tried to (re)install the legacy
      # "tools" package, which Google removed from the repository, and
      # failed the whole job. Nothing else to install here.
      - name: Provide placeholder API secrets (CI has none — Twitch calls are not exercised at build time)
        run: |
          mkdir -p app/src/main/java/com/davidgcd/backlog/config
          if [ ! -f app/src/main/java/com/davidgcd/backlog/config/Secrets.kt ]; then
            sed 's/YOUR_TWITCH_CLIENT_ID/ci-placeholder/; s/YOUR_TWITCH_CLIENT_SECRET/ci-placeholder/' \
              app/src/main/java/com/davidgcd/backlog/config/Secrets.kt.example \
              > app/src/main/java/com/davidgcd/backlog/config/Secrets.kt
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Lint
        run: gradle lintDebug --no-daemon

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: backlog-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
