name: Docs links

# Échoue si un lien relatif d'un fichier .md pointe vers un fichier qui n'existe plus
# (page déplacée ou renommée). Les liens externes ne sont pas testés : pas de faux échecs réseau.
on:
  push:
    branches: ["**"]
    paths: ["**/*.md", "tools/check_docs_links.py", ".github/workflows/docs-links.yml"]
  pull_request:
    paths: ["**/*.md", "tools/check_docs_links.py", ".github/workflows/docs-links.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les liens relatifs
        run: python3 tools/check_docs_links.py
